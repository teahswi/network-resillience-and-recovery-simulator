[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netrescue"
version = "0.1.0"
description = "Network resilience and recovery simulator"
requires-python = ">=3.10"
dependencies = [
    "networkx==3.3",
    "pandas==2.2.3",
    "plotly==5.24.1",
    "pyvis==0.3.2",
    "streamlit==1.39.0",
]

[tool.setuptools.packages.find]
include = ["netrescue*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["netrescue/tests"]
